[project]
name = "design-system"
version = "1.0.0"
description = "Forensic Analytics Design System for Clean Match Chess."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "tinycss2>=1.3",
    "colormath>=3.0",
    "pdfminer.six>=20240706",
    "selectolax>=0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_system"]
