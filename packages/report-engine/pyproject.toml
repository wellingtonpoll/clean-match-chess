[project]
name = "report-engine"
version = "0.1.0"
description = "HTML / PDF / JSON report rendering for Clean Match Chess."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "shared-types",
    "design-system",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=60",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_engine"]
