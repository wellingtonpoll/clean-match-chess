[project]
name = "analysis-core"
version = "0.1.0"
description = "Ingest + engine + pipeline orchestration for Clean Match Chess."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "python-chess>=1.999",
    "httpx>=0.27",
    "structlog>=24",
    "shared-types",
    # Feature 008 — Postgres-backed analysis cache. The runtime gracefully
    # degrades when `DATABASE_URL` is unset, so these are runtime
    # dependencies rather than optional extras.
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_core"]
