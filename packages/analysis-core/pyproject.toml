[project]
name = "analysis-core"
version = "0.1.0"
description = "Ingest + engine + pipeline orchestration for Clean Match Chess."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "python-chess>=1.999",
    "httpx>=0.27",
    "structlog>=24",
    "shared-types",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_core"]
