# Alembic config for analysis-core.
#
# Migration scripts live under `packages/analysis-core/migrations/versions/`.
# The connection URL is resolved at runtime by `migrations/env.py` from the
# `DATABASE_URL` environment variable (falling back to the dev default).
#
# Usage:
#   uv run alembic -c packages/analysis-core/alembic.ini upgrade head
#   uv run alembic -c packages/analysis-core/alembic.ini downgrade base
#   uv run alembic -c packages/analysis-core/alembic.ini revision --autogenerate -m "msg"

[alembic]
script_location = packages/analysis-core/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url intentionally blank — env.py reads DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
