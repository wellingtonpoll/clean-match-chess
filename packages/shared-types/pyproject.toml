[project]
name = "shared-types"
version = "0.1.0"
description = "Shared Pydantic schemas for Clean Match Chess."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_types"]
