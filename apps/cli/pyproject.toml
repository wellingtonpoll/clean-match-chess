[project]
name = "cleanmatch-cli"
version = "0.1.0"
description = "Clean Match Chess command-line fair-play auditor."
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "structlog>=24",
    "shared-types",
    "analysis-core",
    "heuristics",
    "report-engine",
]

[project.scripts]
cleanmatch = "cleanmatch_cli.main:app"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanmatch_cli"]
