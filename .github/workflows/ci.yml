name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Feature 008 — Postgres analysis cache. Cache gracefully degrades
    # when the DB is unreachable, so the integration suite skips on
    # DATABASE_URL absence rather than hard-failing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cleanmatch
          POSTGRES_PASSWORD: cleanmatch
          POSTGRES_DB: cleanmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanmatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cleanmatch:cleanmatch@localhost:5432/cleanmatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Apply database migrations
        run: uv run alembic -c packages/analysis-core/alembic.ini upgrade head

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests (pytest + coverage)
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ github.sha }}
          fail_ci_if_error: false
          verbose: true

  benchmarks:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read
    env:
      CLEANMATCH_BENCH: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras --dev
      - name: Run benchmark suite
        run: |
          uv run pytest -m benchmark \
            packages/analysis-core/benchmarks \
            packages/report-engine/benchmarks \
            packages/design-system/benchmarks \
            --benchmark-only \
            --benchmark-save=ci \
            --benchmark-fail=min:1.10

  design_system_audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras
      - name: Design-system audits (enforced)
        run: |
          uv run pytest \
            packages/design-system/tests/unit/test_audit_palette.py \
            packages/design-system/tests/unit/test_audit_palette_risk.py \
            packages/design-system/tests/unit/test_audit_typography.py \
            packages/design-system/tests/unit/test_audit_typography_role.py \
            packages/design-system/tests/unit/test_audit_motion.py \
            packages/design-system/tests/unit/test_audit_motion_dynamic.py \
            packages/design-system/tests/unit/test_audit_lexical.py \
            --no-cov

  frontend_e2e:
    # Feature 006 — frontend cross-viewport Playwright suite (FR-012, FR-018, SC-006).
    # Path filter: runs only on PRs/pushes that touch apps/frontend/**.
    if: |
      contains(toJson(github.event.pull_request.files.*.filename), 'apps/frontend')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Run Playwright E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          if-no-files-found: ignore

  fpr_gate:
    # Feature 005 — labeled-corpus false-positive-rate gate (FR-006, SC-003).
    # Path filter scopes execution to PRs that could affect scoring;
    # branch protection on `main` is the mechanism that makes this REQUIRED
    # for merge — configure that in the GitHub UI / API after this lands.
    if: |
      contains(toJson(github.event.pull_request.labels.*.name), 'scoring')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras
      - name: Restore engine-analysis cache
        uses: actions/cache@v5
        with:
          path: tests/fixtures/corpora/.cache
          # Cache invalidates when the engine, the bundled book, or any
          # corpus PGN changes — keeping stale analyses out of fresh runs.
          key: fpr-gate-${{ hashFiles('packages/analysis-core/data/opening_book.bin', 'tests/fixtures/corpora/clean/**/*.pgn', 'tests/fixtures/corpora/engine_assisted/**/*.pgn') }}
          restore-keys: |
            fpr-gate-
      - name: Run FPR gate
        run: |
          uv run pytest tests/fpr_gate/test_fpr_gate.py -v -m fpr_gate --no-cov
      - name: Upload FPR gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpr-gate-report
          path: tests/fixtures/corpora/fpr_gate_report.json
          if-no-files-found: ignore

  sc007_onboarding_log:
    if: contains(github.event.pull_request.labels.*.name, 'onboarding-event')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: design_system_audits
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras
      - name: Four locked audits (first-push gate per SC-007)
        run: |
          if [ "${{ github.event.pull_request.commits }}" -ne 1 ]; then
            echo "SC007: skipping --- PR has more than one push"
            exit 0
          fi
          uv run pytest \
            packages/design-system/tests/unit/test_audit_palette.py \
            packages/design-system/tests/unit/test_audit_palette_risk.py \
            packages/design-system/tests/unit/test_audit_typography.py \
            packages/design-system/tests/unit/test_audit_typography_role.py \
            packages/design-system/tests/unit/test_audit_motion.py \
            packages/design-system/tests/unit/test_audit_motion_dynamic.py \
            packages/design-system/tests/unit/test_audit_lexical.py \
            --no-cov
      - name: Emit SC007 structured log line
        if: always()
        run: |
          printf 'SC007_EVENT date=%s author=%s pr=%s result=%s\n' \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.event.pull_request.user.login }}" \
            "${{ github.event.pull_request.html_url }}" \
            "${{ job.status }}"
