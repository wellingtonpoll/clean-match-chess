name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests (pytest + coverage)
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ github.sha }}
          fail_ci_if_error: false
          verbose: true

  benchmarks:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read
    env:
      CLEANMATCH_BENCH: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.11
      - run: uv sync --all-packages --all-extras --dev
      - name: Run benchmark suite
        run: |
          uv run pytest -m benchmark \
            packages/analysis-core/benchmarks \
            packages/report-engine/benchmarks \
            packages/design-system/benchmarks \
            --benchmark-only \
            --benchmark-save=ci \
            --benchmark-fail=min:1.10

  design_system_audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.11
      - run: uv sync --all-packages --all-extras
      - name: Design-system audits (enforced)
        run: |
          uv run pytest \
            packages/design-system/tests/ \
            -m "audit_palette or audit_typography or audit_motion or audit_lexical" \
            --no-cov

  sc007_onboarding_log:
    if: contains(github.event.pull_request.labels.*.name, 'onboarding-event')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: design_system_audits
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.5"
      - run: uv python install 3.11
      - run: uv sync --all-packages --all-extras
      - name: Four locked audits (first-push gate per SC-007)
        run: |
          if [ "${{ github.event.pull_request.commits }}" -ne 1 ]; then
            echo "SC007: skipping --- PR has more than one push"
            exit 0
          fi
          uv run pytest \
            packages/design-system/tests/ \
            -m "audit_palette or audit_typography or audit_motion or audit_lexical" \
            --no-cov
      - name: Emit SC007 structured log line
        if: always()
        run: |
          printf 'SC007_EVENT date=%s author=%s pr=%s result=%s\n' \
            "$(date -u +%Y-%m-%d)" \
            "${{ github.event.pull_request.user.login }}" \
            "${{ github.event.pull_request.html_url }}" \
            "${{ job.status }}"
