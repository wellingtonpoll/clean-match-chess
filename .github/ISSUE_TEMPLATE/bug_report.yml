name: Bug report
description: Report incorrect behavior, crashes, or unexpected output
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below so we can reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-sentence description of the bug.
      placeholder: "cleanmatch audit-game crashes when PGN has no moves"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions that trigger the bug.
      placeholder: |
        1. Run: `cleanmatch audit-game empty.pgn`
        2. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include full error output if available.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uv run cleanmatch --version`
      placeholder: "cleanmatch 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: pgn
    attributes:
      label: Minimal PGN snippet (if applicable)
      description: Paste the smallest PGN that reproduces the issue. Do not include games you do not own.
      render: text
    validations:
      required: false
